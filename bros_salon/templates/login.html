<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROS — Prijava</title>
  <style>
    :root {
      --gold: #C9A84C; --dark: #1A1A2E; --dark2: #16213E;
      --surface: #1E1E3A; --border: #333360; --text: #E0E0E0;
      --text-muted: #9E9E9E; --danger: #E74C3C; --success: #2ECC71;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 30% 50%, rgba(201,168,76,0.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 20%, rgba(52,152,219,0.05) 0%, transparent 50%);
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 8px;
      line-height: 1;
    }
    .logo p {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }
    .logo .scissors { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab {
      flex: 1; padding: 0.7rem; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
      font-weight: 600; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all 0.2s;
    }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; letter-spacing: 0.3px; }
    input {
      width: 100%; padding: 0.7rem 1rem;
      background: var(--dark2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: var(--gold); }
    .btn-gold {
      width: 100%; padding: 0.8rem;
      background: var(--gold); color: var(--dark);
      border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-gold:hover { background: #E8C878; transform: translateY(-1px); }
    .flash {
      padding: 0.7rem 1rem; border-radius: 8px;
      margin-bottom: 1rem; font-size: 0.85rem;
    }
    .flash-error { background: rgba(231,76,60,0.15); border: 1px solid var(--danger); color: #FF7070; }
    .flash-success { background: rgba(46,204,113,0.15); border: 1px solid var(--success); color: #70FF9E; }
    .hint {
      text-align: center; font-size: 0.78rem; color: var(--text-muted);
      margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);
    }
    .hint code {
      background: var(--dark2); padding: 0.1rem 0.4rem;
      border-radius: 4px; color: var(--gold);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">
      <span class="scissors">✂</span>
      <h1>BROS</h1>
      <p>Frizerski Salon</p>
    </div>

    <div class="card">
      {% with messages = get_flashed_messages(with_categories=True) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login', this)">Prijava</button>
        <button class="tab" onclick="switchTab('register', this)">Registracija</button>
      </div>

      <!-- LOGIN -->
      <div class="tab-panel active" id="panel-login">
        <form method="POST" action="/login">
          <div class="form-group">
            <label>Korisničko ime</label>
            <input type="text" name="username" placeholder="Unesite korisničko ime" required autofocus>
          </div>
          <div class="form-group">
            <label>Lozinka</label>
            <input type="password" name="password" placeholder="Unesite lozinku" required>
          </div>
          <button type="submit" class="btn-gold">Prijavi se →</button>
        </form>
        <div class="hint">
          Demo: <code>admin</code>/<code>admin123</code> ili <code>korisnik</code>/<code>korisnik123</code>
        </div>
      </div>

      <!-- REGISTER -->
      <div class="tab-panel" id="panel-register">
        <form method="POST" action="/register">
          <div class="form-group">
            <label>Ime i prezime</label>
            <input type="text" name="full_name" placeholder="Vaše puno ime" required>
          </div>
          <div class="form-group">
            <label>Korisničko ime</label>
            <input type="text" name="username" placeholder="Odaberite korisničko ime" required>
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input type="text" name="phone" placeholder="065xxxxxx">
          </div>
          <div class="form-group">
            <label>Lozinka</label>
            <input type="password" name="password" placeholder="Min. 6 znakova" required>
          </div>
          <button type="submit" class="btn-gold">Registruj se →</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function switchTab(name, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }
  </script>
</body>
</html>
